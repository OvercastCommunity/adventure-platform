import org.gradle.api.initialization.resolve.RepositoriesMode

pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral {
          mavenContent { releasesOnly() }
        }
    }
}

plugins {
  id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = 'adventure-platform-parent'

dependencyResolutionManagement {
  repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
  repositories {
    mavenCentral {
      mavenContent { releasesOnly() }
    }
    maven {
      name = "sponge"
      url = 'https://repo.spongepowered.org/repository/maven-public/'
      mavenContent {
        includeGroup "org.spongepowered"
        includeGroup "com.flowpowered"
      }
    }
    maven {
      name = 'viaversion'
      url = 'https://repo.viaversion.com'
      mavenContent { includeGroup "com.viaversion" }
    }
    maven {
      name = "papermc"
      url = 'https://repo.papermc.io/repository/maven-public/'
      mavenContent {
        includeGroup "io.papermc.paper"
        includeGroup "com.destroystokyo.paper"
        includeGroup "net.md-5"
      }
    }
    maven {
      name = "minecraft-libraries"
      url = "https://libraries.minecraft.net"
      mavenContent {
        includeGroup "com.mojang"
      }
    }
  }
}

include 'text-serializer-bungeecord'
findProject(':text-serializer-bungeecord')?.name = 'adventure-text-serializer-bungeecord'

include 'api'
findProject(':api')?.name = 'adventure-platform-api'

['facet', 'viaversion', 'bukkit', 'bungeecord', 'spongeapi'].each {
  include "platform-$it"
  findProject(":platform-$it")?.name = "adventure-platform-$it"
}

enableFeaturePreview("NO_IMPLICIT_LOOKUP_IN_PARENT_PROJECTS")
enableFeaturePreview("STABLE_CONFIGURATION_CACHE")
